name: mobile
description: "Talento mobile application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  http: ^1.6.0
  flutter_bloc: ^8.1.6

  flutter_secure_storage: ^9.2.2
  flutter_svg: ^2.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/icons/

  fonts:
    - family: ArialRounded
      fonts:
        - asset: assets/fonts/Arial Rounded MT Bold Regular.ttf
          weight: 400

    - family: BerlinSans
      fonts:
        - asset: assets/fonts/BRLNSDB.TTF
          weight: 700

    - family: DGAgnadeen
      fonts:
        - asset: assets/fonts/DGAgnadeen-Regular.ttf
          weight: 400
        - asset: assets/fonts/DGAgnadeen-Extrabold.ttf
          weight: 700
        - asset: assets/fonts/DGAgnadeen-Heavy.ttf
          weight: 800