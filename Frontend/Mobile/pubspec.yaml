name: mobile
description: "Talento mobile application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  http: ^1.6.0
  flutter_bloc: ^8.1.6

  flutter_secure_storage: ^9.2.2
  flutter_svg: ^2.2.4
  file_picker: ^10.2.0
  mobile_scanner: ^7.2.0
  sensors_plus: ^7.0.0
  flame: ^1.35.1
  flame_forge2d: ^0.19.2+4
  flutter_tts: ^4.2.5
  video_player: ^2.8.6
  equatable: ^2.0.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/icons/

  fonts:
    - family: ArialRounded
      fonts:
        - asset: assets/fonts/Arial Rounded MT Bold Regular.ttf
          weight: 400

    - family: BerlinSans
      fonts:
        - asset: assets/fonts/BRLNSDB.TTF
          weight: 700

    - family: DGAgnadeen
      fonts:
        - asset: assets/fonts/DGAgnadeen-Regular.ttf
          weight: 400
        - asset: assets/fonts/DGAgnadeen-Extrabold.ttf
          weight: 700
        - asset: assets/fonts/DGAgnadeen-Heavy.ttf
          weight: 800