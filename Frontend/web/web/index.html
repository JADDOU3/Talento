<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="web">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="icon.png" />

  <title>Talento</title>
  <link rel="manifest" href="manifest.json">

  <!--  CUSTOM LOADER STYLE -->
  <style>

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1A9E75;
    }

    body {//0xFF1A9E75
      background: #1A9E75;
    }

    flt-glass-pane, flt-scene-host, canvas {
      background: #1A9E75 !important;
    }

    .splash-screen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #1A9E75  0%, #1a4d3a 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 1.5s ease-in-out;
    }

        /* Animated background pulses */
        @keyframes moveBackground {
          from { transform: translate(-25%, -25%); }
          to { transform: translate(0, 0); }
        }

        .logo-wrapper {
      position: relative;
      animation: float 4s ease-in-out infinite;
      overflow: hidden; /* This clips the line so it doesn't leave the logo area */
      border-radius: 20px; /* Optional: Adjust if your logo has rounded corners */
      display: flex;
    }


        .logo-pulse {
          width: 250px;
          animation: pulse-scale 3s infinite ease-in-out;
        }

    .hidden .logo-wrapper {
      animation: exit-anim 1.5s ease-in-out forwards;
    }

    @keyframes exit-anim {
      0% { transform: scale(1) rotate(0deg); opacity: 1; }
      100% { transform: scale(13) rotate(10deg); opacity: 0; }
    }

        @keyframes float {
          0%, 100% { transform: translateY(0) rotate(-2deg); }
          50% { transform: translateY(-20px) rotate(2deg); }
        }

        @keyframes pulse-scale {
          0%, 100% { transform: scale(1); filter: brightness(1); }
          50% { transform: scale(1.05); filter: brightness(1.2); }
        }



        .hidden {
          opacity: 0;
          pointer-events: none;
        }
  </style>
</head>

<body>

<div class="splash-screen" id="loader">
  <div class="logo-wrapper">
    <img src="img.png" class="logo-pulse">
  </div>
</div>

<!-- Flutter bootstrap -->
<script src="flutter_bootstrap.js" async></script>

<!-- Hide loader when Flutter is ready -->
<script>
  window.addEventListener('flutter-first-frame', function () {
    const loader = document.getElementById('loader');
    loader.classList.add('hidden');

    // Optional: Completely remove the loader from memory after fade-out
    setTimeout(() => {
      loader.remove();
    }, 1500); // Matches your CSS transition time
  });
</script>

</body>
</html>
