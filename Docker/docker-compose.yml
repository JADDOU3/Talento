services:

  mysql:
    image: mysql:8
    container_name: mysql
    restart: always
    env_file:
      /.env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: talento
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: Docker/backend/Dockerfile
    container_name: backend
    restart: always
    env_file:
      /.env
    expose:
      - "8080"
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/talento
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      AWS_REGION: ${AWS_REGION}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network


  frontend:
      image: jaddou333/talento-frontend:latest
      container_name: frontend
      restart: always
      expose:
        - "3000"
      networks:
        - app-network


  ai:
    build:
      context: ..
      dockerfile: Docker/ai/Dockerfile
    container_name: ai
    restart: always
    expose:
      - "8000"
    networks:
      - app-network



  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
      - frontend
      - ai
    networks:
      - app-network

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge